name: Import storyboard image ZIP
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Existing project id, e.g. chicken-nanban-001'
        required: true
        default: 'chicken-nanban-001'
      zip_url:
        description: 'HTTPS URL to ZIP accessible by GitHub runner (not a ChatGPT sandbox link)'
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate URL and project
        env:
          PROJECT: ${{ inputs.project }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          python - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          assert re.fullmatch(r'[a-z0-9][a-z0-9-]{0,62}',os.environ['PROJECT'])
          u=urlsplit(os.environ['ZIP_URL'])
          assert u.scheme=='https' and u.netloc and not u.username and not u.password
          PY
      - name: Import pages
        env:
          PROJECT: ${{ inputs.project }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: python scripts/import_storyboard_images.py --project "$PROJECT" --url "$ZIP_URL"
      - name: Commit only storyboard images
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "projects/$PROJECT/storyboard-pages"
          if git diff --cached --quiet; then
            echo 'No new image changes.'
          else
            git commit -m "assets: import storyboard pages for $PROJECT"
            git push
          fi

name: Validate projects
on:
  push:
    paths:
      - "projects/**"
      - "studio/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/validate.yml"
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Validate projects (fails on contract errors; blockers are reported)
        run: python scripts/studio.py validate
      - name: Unit tests
        run: python -m unittest discover -s tests -v
